services:
  app:
    image: ${PUBLIC_COOKBOOK_IMAGE:-local/vanilla-cookbook-adapter:0034x}
    container_name: cookbook-public-core
    env_file:
      - ${PUBLIC_CORE_ENV_FILE:?Set PUBLIC_CORE_ENV_FILE to the ignored core .env path}
      - ${PUBLIC_CORE_OIDC_ENV_FILE:?Set PUBLIC_CORE_OIDC_ENV_FILE to the ignored public OIDC env path}
      - ./.env.public-ai
    environment:
      ORIGIN: https://cookbook.roadmaps.link
      AI_SIDECAR_ENABLED: "true"
      AI_SIDECAR_URL: http://ai-api:8000
    volumes:
      - cookbook-public-db:/app/prisma/db
      - cookbook-public-uploads:/app/uploads
    depends_on:
      ai-api:
        condition: service_healthy
    networks:
      cookbook-public-tunnel:
        aliases:
          - app
    restart: unless-stopped

  ai-api:
    build:
      context: ./ai-api
    image: local/cookbook-ai-sidecar:0034z
    container_name: cookbook-public-ai
    env_file:
      - ./.env
      - ./.env.public-ai
    environment:
      AI_PROVIDER: openai
      AI_MODEL: gpt-5.4-nano
      OPENAI_MODEL: gpt-5.4-nano
      OPENAI_ENABLE_LIVE_TESTS: "true"
      OPENAI_LIVE_TEST_BUDGET_CENTS: "25"
      AI_MAX_OUTPUT_TOKENS: "1800"
      AI_PROVIDER_CALLS_ENABLED: "true"
      AI_PROVIDER_GLOBAL_DISABLE: "false"
      AI_PROVIDER_BUDGET_MODE: enforce
      AI_PROVIDER_MAX_CALLS_PER_DEMO_SESSION: "22"
      AI_PROVIDER_MAX_INPUT_TOKENS_PER_CALL: "12000"
      AI_PROVIDER_MAX_OUTPUT_TOKENS_PER_CALL: "1800"
      AI_PROVIDER_MAX_TOTAL_TOKENS_PER_CALL: "13800"
      AI_PROVIDER_MAX_ESTIMATED_COST_USD_PER_SESSION: "0.25"
      AI_PROVIDER_MAX_ESTIMATED_COST_USD_PER_CALL: "0.05"
      AI_OPERATOR_GATE_ENABLED: "true"
      AI_OPERATOR_GATE_LOCAL_BYPASS: "false"
      AI_OPERATOR_GATE_ALLOWED_WORKFLOWS: importer,recipe_session
      AI_RECIPE_DATASET_WARM_ON_START: "true"
      RECIPE_DATASET_DIR: /app/recipe-dataset
      RECIPE_DATASET_INDEX_LIMIT: "5000"
    volumes:
      - type: bind
        source: ./recipe-dataset
        target: /app/recipe-dataset
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - cookbook-public-tunnel
    restart: unless-stopped

networks:
  cookbook-public-tunnel:
    name: cookbook-public-tunnel
    external: true

volumes:
  cookbook-public-db:
    external: true
    name: cookbook-public-core-db
  cookbook-public-uploads:
    external: true
    name: cookbook-public-core-uploads
