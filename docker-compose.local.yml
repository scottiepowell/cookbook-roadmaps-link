services:
  app:
    image: ${VANILLA_COOKBOOK_IMAGE:-jt196/vanilla-cookbook:stable}
    environment:
      VANILLA_COOKBOOK_IMAGE: ${VANILLA_COOKBOOK_IMAGE:-jt196/vanilla-cookbook:stable}
      COOKBOOK_TARGET_URL: ${COOKBOOK_TARGET_URL:-http://127.0.0.1:3000/}
      RUN_LOCAL_DEV_AUTH_FIXTURE: ${RUN_LOCAL_DEV_AUTH_FIXTURE:-0}
      LOCAL_DEV_AUTH_FIXTURE_APPROVED: ${LOCAL_DEV_AUTH_FIXTURE_APPROVED:-0}
      RUN_LOCAL_PERSISTENT_AUTH_FIXTURE: ${RUN_LOCAL_PERSISTENT_AUTH_FIXTURE:-0}
      LOCAL_PERSISTENT_AUTH_FIXTURE_APPROVED: ${LOCAL_PERSISTENT_AUTH_FIXTURE_APPROVED:-0}
      SYNTHETIC_AUTH_FIXTURE: ${SYNTHETIC_AUTH_FIXTURE:-0}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./.local/vanilla-cookbook/db:/app/prisma/db
      - ./.local/vanilla-cookbook/uploads:/app/uploads
    restart: unless-stopped
